<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product — LUXE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen">

<nav class="sticky top-0 z-50 backdrop-blur-lg bg-neutral-950/70 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="text-2xl font-semibold tracking-widest">LUXE</a>
    <a href="index.html" class="text-sm text-neutral-300 hover:text-white">← Back to Shop</a>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-12">
  <div id="content" class="grid md:grid-cols-2 gap-12">
    <p class="text-neutral-400">Loading...</p>
  </div>
</main>

<script type="module">
import { products } from './data.js';

// Read ?id=1 from URL
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id'));
const product = products.find(p => p.id === id);

if (!product) {
  document.getElementById('content').innerHTML = `
    <div class="col-span-2 text-center py-24">
      <h1 class="text-3xl mb-4">Product not found</h1>
      <a href="index.html" class="text-amber-300 underline">Return to shop</a>
    </div>
  `;
} else {
  render(product);
}

function render(p) {
  const ghs = (p.price * 15).toFixed(2);
  document.title = `${p.name} — LUXE`;
  document.getElementById('content').innerHTML = `
    <div class="rounded-2xl overflow-hidden border border-white/10 aspect-square">
      <img src="${p.img}" class="w-full h-full object-cover"/>
    </div>
    <div class="flex flex-col justify-center">
      <p class="text-amber-400 text-xs tracking-[0.3em] mb-3">${p.category.toUpperCase()}</p>
      <h1 class="text-4xl md:text-5xl font-light mb-4">${p.name}</h1>
      <p class="text-neutral-400 leading-relaxed mb-6">${p.description}</p>
      <div class="text-3xl font-semibold text-amber-300 mb-2">GH₵${ghs}</div>
      <p class="text-sm text-neutral-500 mb-8">(approx. $${p.price} USD)</p>

      <div class="flex items-center gap-4 mb-8">
        <span class="text-neutral-400 text-sm">Quantity</span>
        <div class="flex items-center border border-white/20 rounded-full">
          <button onclick="changeQty(-1)" class="px-4 py-2 hover:text-amber-300">−</button>
          <span id="qty" class="px-2 w-8 text-center">1</span>
          <button onclick="changeQty(1)" class="px-4 py-2 hover:text-amber-300">+</button>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="addFromDetail()" class="flex-1 bg-white text-black py-3 rounded-full font-medium hover:bg-amber-300 transition">
          Add to Cart
        </button>
        <button onclick="buyNow()" class="flex-1 bg-amber-400 text-black py-3 rounded-full font-medium hover:bg-amber-300 transition">
          Buy Now
        </button>
      </div>
    </div>
  `;
  window.currentProduct = p;
}

let qty = 1;

window.changeQty = function(delta) {
  qty = Math.max(1, qty + delta);
  document.getElementById('qty').textContent = qty;
};

window.addFromDetail = function() {
  // Save to localStorage so index.html cart can pick it up
  const cart = JSON.parse(localStorage.getItem('luxe_cart') || '[]');
  const existing = cart.find(i => i.id === window.currentProduct.id);
  if (existing) existing.qty += qty;
  else cart.push({ ...window.currentProduct, qty });
  localStorage.setItem('luxe_cart', JSON.stringify(cart));
  alert(`✅ Added ${qty} × ${window.currentProduct.name} to cart`);
};

window.buyNow = function() {
  const cart = [{ ...window.currentProduct, qty }];
  localStorage.setItem('luxe_cart', JSON.stringify(cart));
  window.location.href = 'index.html#checkout';
};
</script>
</body>
</html>
