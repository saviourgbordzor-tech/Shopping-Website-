<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LUXE — Premium Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .card:hover img { transform: scale(1.05); }
</style>
</head>
<body class="bg-neutral-950 text-white">

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 backdrop-blur-lg bg-neutral-950/70 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-semibold tracking-widest">LUXE</h1>
    <div class="hidden md:flex gap-8 text-sm text-neutral-300">
      <a href="#" class="hover:text-white">Shop</a>
      <a href="#" class="hover:text-white">Collections</a>
      <a href="#" class="hover:text-white">About</a>
    </div>
    <button onclick="toggleCart()" class="relative">
      🛒 <span id="cartCount" class="absolute -top-2 -right-3 bg-amber-500 text-black text-xs rounded-full px-1.5">0</span>
    </button>
  </div>
</nav>

<!-- HERO -->
<section class="max-w-7xl mx-auto px-6 py-24 text-center">
  <p class="text-amber-400 text-sm tracking-[0.3em] mb-4">NEW ARRIVALS 2025</p>
  <h2 class="text-5xl md:text-7xl font-light leading-tight mb-6">
    Timeless <span class="italic text-amber-300">Elegance</span><br/>Redefined.
  </h2>
  <p class="text-neutral-400 max-w-xl mx-auto mb-8">Curated pieces crafted for the modern connoisseur.</p>
  <a href="#shop" class="inline-block bg-white text-black px-8 py-3 rounded-full font-medium hover:bg-amber-300 transition">Explore Collection</a>
</section>

<!-- PRODUCTS -->
<section id="shop" class="max-w-7xl mx-auto px-6 pb-24">
  <h3 class="text-3xl font-light mb-10">Featured Pieces</h3>
  <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
</section>

<!-- CART DRAWER -->
<div id="cartDrawer" class="fixed top-0 right-0 h-full w-96 bg-neutral-900 border-l border-white/10 transform translate-x-full transition-transform z-50 p-6 flex flex-col">
  <div class="flex justify-between mb-6">
    <h4 class="text-xl">Your Cart</h4>
    <button onclick="toggleCart()">✕</button>
  </div>
  <div id="cartItems" class="flex-1 overflow-y-auto space-y-4"></div>
  <div class="border-t border-white/10 pt-4 mt-4">
    <div class="flex justify-between mb-4 text-lg">
      <span>Total</span><span id="cartTotal">$0</span>
    </div>
    <button onclick="checkout()" class="w-full bg-amber-400 text-black py-3 rounded-full font-medium hover:bg-amber-300">Checkout</button>
  </div>
</div>

<script>
const products = [
  { id: 1, name: "Aurora Watch",   price: 249, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" },
  { id: 2, name: "Silk Scarf",     price: 89,  img: "https://images.unsplash.com/photo-1601924994987-69e26d50dc26?w=600" },
  { id: 3, name: "Leather Bag",    price: 399, img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600" },
  { id: 4, name: "Designer Shades",price: 179, img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600" },
];

let cart = [];

function renderProducts() {
  document.getElementById('productGrid').innerHTML = products.map(p => `
    <div class="card group bg-neutral-900 rounded-2xl overflow-hidden border border-white/5">
      <div class="overflow-hidden aspect-square">
        <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-500"/>
      </div>
      <div class="p-5">
        <h4 class="font-medium mb-1">${p.name}</h4>
        <p class="text-neutral-400 text-sm mb-3">Premium quality craftsmanship.</p>
        <div class="flex justify-between items-center">
          <span class="text-amber-300 font-semibold">$${p.price}</span>
          <button onclick="addToCart(${p.id})" class="text-sm border border-white/20 px-4 py-1.5 rounded-full hover:bg-white hover:text-black transition">Add</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id) {
  const item = cart.find(i => i.id === id);
  if (item) item.qty++;
  else cart.push({ ...products.find(p => p.id === id), qty: 1 });
  updateCart();
  toggleCart(true);
}

function updateCart() {
  const count = cart.reduce((s,i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count;
  const total = cart.reduce((s,i) => s + i.qty * i.price, 0);
  document.getElementById('cartTotal').textContent = '$' + total;
  document.getElementById('cartItems').innerHTML = cart.map(i => `
    <div class="flex gap-3 items-center">
      <img src="${i.img}" class="w-14 h-14 rounded-lg object-cover"/>
      <div class="flex-1">
        <p class="text-sm">${i.name}</p>
        <p class="text-xs text-neutral-400">$${i.price} × ${i.qty}</p>
      </div>
    </div>
  `).join('') || '<p class="text-neutral-500">Cart is empty.</p>';
}

function toggleCart(forceOpen) {
  const d = document.getElementById('cartDrawer');
  if (forceOpen || d.classList.contains('translate-x-full')) d.classList.remove('translate-x-full');
  else d.classList.add('translate-x-full');
}

function checkout() {
  if (cart.length === 0) return alert("Cart is empty");
  alert("✅ Checkout flow — integrate Stripe here next!");
}

renderProducts();
</script>
</body>
</html>
